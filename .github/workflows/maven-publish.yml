name: Build and Deploy

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - uses: actions/checkout@v4.1.7

    - name: Set up JDK 21
      uses: actions/setup-java@v4.2.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: CENTRAL_TOKEN_USERNAME
        server-password: CENTRAL_TOKEN_PASSWORD

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        trust_level: 5
        
    - name: List GPG keys and verify import
      env:
        GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        GPG_KEYID: ${{ steps.import_gpg.outputs.keyid }}
        GPG_EMAIL: ${{ steps.import_gpg.outputs.email }}
        GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      run: |
        echo "=== GPG Import Results ==="
        echo "Key ID: $GPG_KEYID"
        echo "Email: $GPG_EMAIL"
        echo "Fingerprint: $GPG_FINGERPRINT"
        
        echo "=== Detailed GPG keyring analysis ==="
        echo "Public keys:"
        gpg --list-keys --keyid-format=LONG
        echo "Secret keys:"
        gpg --list-secret-keys --keyid-format=LONG
        echo "Secret keys with colons format:"
        gpg --list-secret-keys --with-colons
        
        echo "=== Checking key trust and capabilities ==="
        gpg --list-secret-keys --with-colons | grep -E '^(sec|ssb|uid)'
        
        echo "=== Verifying secret key exists ==="
        if gpg --list-secret-keys | grep -q "$GPG_KEYID"; then
          echo "Secret key $GPG_KEYID found in keyring"
        else
          echo "SECRET KEY NOT FOUND! This is the problem."
          echo "Available secret keys:"
          gpg --list-secret-keys --keyid-format=SHORT
          exit 1
        fi
        
        echo "=== Testing different signing approaches ==="
        
        # Method 1: Try with key ID
        echo "Method 1: Testing with key ID $GPG_KEYID"
        if echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign --default-key "$GPG_KEYID" 2>&1; then
          echo "SUCCESS: Key ID signing worked"
          echo "GPG_KEY=$GPG_KEYID" >> $GITHUB_ENV
        else
          echo "FAILED: Key ID signing failed"
          
          # Method 2: Try with email
          echo "Method 2: Testing with email $GPG_EMAIL"
          if echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign --default-key "$GPG_EMAIL" 2>&1; then
            echo "SUCCESS: Email signing worked"
            echo "GPG_KEY=$GPG_EMAIL" >> $GITHUB_ENV
          else
            echo "FAILED: Email signing failed"
            
            # Method 3: Try with fingerprint
            echo "Method 3: Testing with fingerprint $GPG_FINGERPRINT"
            if echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign --default-key "$GPG_FINGERPRINT" 2>&1; then
              echo "SUCCESS: Fingerprint signing worked"
              echo "GPG_KEY=$GPG_FINGERPRINT" >> $GITHUB_ENV
            else
              echo "FAILED: Fingerprint signing failed"
              
              # Method 4: Try without --default-key (use first available key)
              echo "Method 4: Testing without --default-key (first available secret key)"
              if echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign 2>&1; then
                echo "SUCCESS: Default key signing worked"
                echo "GPG_KEY=" >> $GITHUB_ENV  # Empty means use default
              else
                echo "FAILED: All signing methods failed"
                echo "This indicates a problem with the private key import or format"
                exit 1
              fi
            fi
          fi
        fi

    - name: Build with Maven
      run: mvn -B --update-snapshots package -DskipTests --file pom.xml
# Disable 'maven-dependency-submission-action' as it fails with
# "	Error: TypeError: Cannot read properties of undefined (reading 'forEach')
# 	Error: Error: Could not generate a snapshot of the dependencies; Cannot read properties of undefined (reading 'forEach')
#  	Error: Failed to generate a dependency snapshot, check logs for more details, Error: Could not generate a snapshot of the dependencies; Cannot read properties of undefined (reading 'forEach')
# "
#    - name: Update dependency graph
#      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
    - name: Deploy to Central Portal
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: |
        echo "Signing with GPG key: $GPG_KEY"
        
        # Configure GPG for Maven
        export GPG_TTY=$(tty)
        
        mvn --batch-mode deploy \
          -Dgpg.passphrase="${GPG_PASSPHRASE}" \
          -Dgpg.keyname="${GPG_KEY}" \
          -Dgpg.executable=gpg \
          -Dgpg.useagent=false

        

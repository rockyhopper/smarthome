name: Build and Deploy

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - uses: actions/checkout@v4.1.7

    - name: Set up JDK 21
      uses: actions/setup-java@v4.2.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: CENTRAL_TOKEN_USERNAME
        server-password: CENTRAL_TOKEN_PASSWORD

    - name: Import GPG key
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        trust_level: 5
        
    - name: List and test GPG keys
      env:
        GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: |
        echo "=== Listing GPG keys ==="
        gpg --list-secret-keys --keyid-format=LONG
        
        echo "=== Getting key ID (multiple methods) ==="
        # Method 1: Extract from sec line
        GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=LONG | grep -A1 "sec" | grep -v "sec" | head -1 | xargs)
        echo "Method 1 - GPG Key ID: '$GPG_KEY_ID'"
        
        # Method 2: Extract from sec line directly
        if [ -z "$GPG_KEY_ID" ]; then
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=LONG | grep "sec" | sed 's/.*\/\([A-F0-9]*\).*/\1/')
          echo "Method 2 - GPG Key ID: '$GPG_KEY_ID'"
        fi
        
        # Method 3: Use fingerprint
        if [ -z "$GPG_KEY_ID" ]; then
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | grep "^sec" | cut -d: -f5)
          echo "Method 3 - GPG Key ID: '$GPG_KEY_ID'"
        fi
        
        # Method 4: Get the last 16 characters of fingerprint
        if [ -z "$GPG_KEY_ID" ]; then
          GPG_KEY_ID=$(gpg --list-secret-keys --with-fingerprint --keyid-format=LONG | grep "Key fingerprint" | sed 's/.*= //' | sed 's/ //g' | tail -c 17)
          echo "Method 4 - GPG Key ID: '$GPG_KEY_ID'"
        fi
        
        echo "Final GPG Key ID: '$GPG_KEY_ID'"
        echo "GPG_KEY_ID=$GPG_KEY_ID" >> $GITHUB_ENV
        
        if [ -z "$GPG_KEY_ID" ]; then
          echo "ERROR: Could not extract GPG key ID"
          echo "Full GPG output:"
          gpg --list-secret-keys --keyid-format=LONG --with-fingerprint
          exit 1
        fi
        
        echo "=== Testing GPG signing ==="
        echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign --default-key "$GPG_KEY_ID"
        
        echo "=== GPG key setup complete ==="

    - name: Build with Maven
      run: mvn -B --update-snapshots package -DskipTests --file pom.xml
# Disable 'maven-dependency-submission-action' as it fails with
# "	Error: TypeError: Cannot read properties of undefined (reading 'forEach')
# 	Error: Error: Could not generate a snapshot of the dependencies; Cannot read properties of undefined (reading 'forEach')
#  	Error: Failed to generate a dependency snapshot, check logs for more details, Error: Could not generate a snapshot of the dependencies; Cannot read properties of undefined (reading 'forEach')
# "
#    - name: Update dependency graph
#      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
    - name: Deploy to Central Portal
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: |
        echo "Using GPG Key ID: $GPG_KEY_ID"
        
        # Configure GPG for Maven
        export GPG_TTY=$(tty)
        
        # Try with key ID first, fallback to email if key ID is empty
        if [ -n "$GPG_KEY_ID" ] && [ "$GPG_KEY_ID" != "" ]; then
          echo "Signing with Key ID: $GPG_KEY_ID"
          mvn --batch-mode deploy \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -Dgpg.keyname="${GPG_KEY_ID}" \
            -Dgpg.executable=gpg \
            -Dgpg.useagent=false
        else
          echo "Key ID not found, trying with email address"
          # Extract email from GPG key
          GPG_EMAIL=$(gpg --list-secret-keys | grep -E "uid.*<.*@.*>" | head -1 | sed 's/.*<\(.*@.*\)>.*/\1/')
          echo "Using email: $GPG_EMAIL"
          mvn --batch-mode deploy \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -Dgpg.keyname="${GPG_EMAIL}" \
            -Dgpg.executable=gpg \
            -Dgpg.useagent=false
        fi

        

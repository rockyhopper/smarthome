name: Build and Deploy

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - uses: actions/checkout@v4.1.7

    - name: Set up JDK 21
      uses: actions/setup-java@v4.2.1
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: central
        server-username: CENTRAL_TOKEN_USERNAME
        server-password: CENTRAL_TOKEN_PASSWORD

    - name: Import GPG key
      id: import_gpg
      uses: crazy-max/ghaction-import-gpg@v6
      with:
        gpg_private_key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
        passphrase: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        trust_level: 5
        
    - name: Diagnose GPG key and attempt manual import
      env:
        GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
        GPG_KEYID: ${{ steps.import_gpg.outputs.keyid }}
        GPG_EMAIL: ${{ steps.import_gpg.outputs.email }}
        GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      run: |
        echo "=== GPG Import Results ==="
        echo "Key ID: $GPG_KEYID"
        echo "Email: $GPG_EMAIL"
        echo "Fingerprint: $GPG_FINGERPRINT"
        
        echo "=== Analyzing GPG secret key format ==="
        # Check if the secret key variable contains the expected headers
        if echo "${{ secrets.OSSRH_GPG_SECRET_KEY }}" | head -1 | grep -q "BEGIN PGP PRIVATE KEY"; then
          echo "✅ Secret key appears to have correct PGP header"
        else
          echo "❌ Secret key missing 'BEGIN PGP PRIVATE KEY' header"
          echo "First line of secret key: $(echo '${{ secrets.OSSRH_GPG_SECRET_KEY }}' | head -1)"
        fi
        
        echo "=== Current keyring status ==="
        echo "Public keys:"
        gpg --list-keys --keyid-format=LONG
        echo "Secret keys:"
        gpg --list-secret-keys --keyid-format=LONG
        
        if ! gpg --list-secret-keys | grep -q "$GPG_KEYID"; then
          echo "❌ SECRET KEY NOT IMPORTED - Attempting manual import"
          
          # Try manual import with more verbose output
          echo "=== Attempting manual GPG import ==="
          echo '${{ secrets.OSSRH_GPG_SECRET_KEY }}' | gpg --batch --import --verbose 2>&1
          
          echo "=== Checking keyring after manual import ==="
          echo "Secret keys after manual import:"
          gpg --list-secret-keys --keyid-format=LONG
          
          if gpg --list-secret-keys | grep -q "$GPG_KEYID"; then
            echo "✅ Manual import successful!"
          else
            echo "❌ Manual import also failed"
            echo "=== Diagnostic information ==="
            echo "Secret key length: $(echo '${{ secrets.OSSRH_GPG_SECRET_KEY }}' | wc -c) characters"
            echo "Secret key lines: $(echo '${{ secrets.OSSRH_GPG_SECRET_KEY }}' | wc -l) lines"
            echo "This suggests the secret key format or content is incorrect"
            exit 1
          fi
        fi
        
        echo "=== Testing GPG signing ==="
        # Method 1: Try with key ID
        echo "Method 1: Testing with key ID $GPG_KEYID"
        if echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign --default-key "$GPG_KEYID" 2>&1; then
          echo "SUCCESS: Key ID signing worked"
          echo "GPG_KEY=$GPG_KEYID" >> $GITHUB_ENV
        else
          echo "FAILED: Key ID signing failed, trying email"
          
          # Method 2: Try with email
          echo "Method 2: Testing with email $GPG_EMAIL"
          if echo "test" | gpg --batch --yes --passphrase "$GPG_PASSPHRASE" --pinentry-mode loopback --armor --detach-sign --default-key "$GPG_EMAIL" 2>&1; then
            echo "SUCCESS: Email signing worked"
            echo "GPG_KEY=$GPG_EMAIL" >> $GITHUB_ENV
          else
            echo "FAILED: Both key ID and email signing failed"
            exit 1
          fi
        fi

    - name: Build with Maven
      run: mvn -B --update-snapshots package -DskipTests --file pom.xml
# Disable 'maven-dependency-submission-action' as it fails with
# "	Error: TypeError: Cannot read properties of undefined (reading 'forEach')
# 	Error: Error: Could not generate a snapshot of the dependencies; Cannot read properties of undefined (reading 'forEach')
#  	Error: Failed to generate a dependency snapshot, check logs for more details, Error: Could not generate a snapshot of the dependencies; Cannot read properties of undefined (reading 'forEach')
# "
#    - name: Update dependency graph
#      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
    - name: Deploy to Central Portal
      env:
        CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
        CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
      run: |
        echo "Signing with GPG key: $GPG_KEY"
        
        # Configure GPG for Maven
        export GPG_TTY=$(tty)
        
        echo "=== Maven Settings Check (SECURE) ==="
        echo "Maven settings file exists: $(test -f ~/.m2/settings.xml && echo 'YES' || echo 'NO')"
        if [ -f ~/.m2/settings.xml ]; then
          echo "Settings file size: $(stat -c%s ~/.m2/settings.xml) bytes"
          echo "Contains 'central' server: $(grep -q '<id>central</id>' ~/.m2/settings.xml && echo 'YES' || echo 'NO')"
        fi
        
        echo "=== Central Portal Deployment Debug ==="
        echo "Username length: $(echo -n "$CENTRAL_TOKEN_USERNAME" | wc -c)"
        echo "Password length: $(echo -n "$CENTRAL_TOKEN_PASSWORD" | wc -c)"
        echo "First few chars of username: $(echo "$CENTRAL_TOKEN_USERNAME" | cut -c1-8)..."
        
        # Try deployment with more verbose output
        echo "=== Starting Maven Deployment ==="
        mvn --batch-mode deploy \
          -DskipTests \
          -Dgpg.passphrase="${GPG_PASSPHRASE}" \
          -Dgpg.keyname="${GPG_KEY}" \
          -Dgpg.executable=gpg \
          -Dgpg.useagent=false

        
